[mcp_servers.agentgov_governance]
command = "agentgov"
args = ["adapter", "governance-mcp", "--host-profile", "codex"]
enabled = true
required = true
enabled_tools = ["agentgov_alignment_start", "agentgov_alignment_update", "agentgov_alignment_resolve", "agentgov_self_review_start", "agentgov_self_review_complete"]
default_tools_approval_mode = "auto"
startup_timeout_sec = 10
tool_timeout_sec = 60
