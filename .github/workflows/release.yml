name: Stable release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Validate tag and package version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(PYTHONPATH=src python -c 'import agentgov; print(agentgov.__version__)')"
          test "$version" = "$package_version"

      - name: Run release tests
        run: python -m unittest discover -s tests -v

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Generate and validate immutable release manifest
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python scripts/build_release_manifest.py \
            dist/agent_governance_starter-"$version"-py3-none-any.whl \
            dist/release-manifest.json \
            --version "$version"
          PYTHONPATH=src python -m agentgov check release-manifest \
            dist/release-manifest.json

      - name: Create GitHub Release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/agent_governance_starter-*.whl \
            dist/release-manifest.json \
            --verify-tag \
            --title "AgentGov $GITHUB_REF_NAME" \
            --generate-notes
